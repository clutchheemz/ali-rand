<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <!-- a private family invitation: keep it out of search engines (link previews still work) -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="__PAPER__" />
    <meta name="color-scheme" content="only light" />
    <meta name="format-detection" content="telephone=no, date=no, address=no" />
    <link rel="canonical" href="__SITE_URL__" />

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:site_name" content="__TITLE__" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__og-image.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__TITLE__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__TITLE__" />
    <meta name="twitter:description" content="__DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_URL__og-image.jpg" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: __PAPER__;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #boot::after {
        content: '';
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid rgba(123, 31, 43, 0.2);
        border-top-color: #7b1f2b;
        animation: boot 0.9s linear infinite;
      }
      @keyframes boot {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
